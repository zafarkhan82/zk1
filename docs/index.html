    <script>
      // Zeigt unerwartete Fehler an, statt eine weiße Seite zu hinterlassen (Fehlersuche auf dem Handy).
      (function () {
        function show(msg) {
          var root = document.getElementById('root');
          if (root && root.children.length && root.innerText.trim().length > 20) return;
          var d = document.getElementById('kt-error') || document.createElement('pre');
          d.id = 'kt-error';
          d.style.cssText = 'position:fixed;inset:0;z-index:99999;margin:0;padding:24px;padding-top:60px;background:#F4F7F5;color:#C93A3A;font:13px/1.4 monospace;white-space:pre-wrap;overflow:auto';
          d.textContent = '🤕 Da ist etwas schiefgelaufen. Bitte Screenshot schicken.\n\n' + msg;
          document.body.appendChild(d);
        }
        window.addEventListener('error', function (e) { show((e.message || 'Fehler') + '\n' + (e.filename || '') + ':' + (e.lineno || '')); });
        window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; show('Promise: ' + (r.message || r) + '\n' + (r.stack || '').split('\n').slice(0, 5).join('\n')); });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.innerText.trim().length < 5) show('Die App hat nach 12 Sekunden nichts angezeigt.\nAdresse: ' + location.pathname + (location.hash ? ' (mit #…)' : ''));
        }, 12000);
      })();
    </script>
